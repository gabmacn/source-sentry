[workspace]
members = ["crates/core", "crates/git", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://git.gabmacn.com/gmn/source-sentry"
readme = "README.md"
# Only to the `gmn` Cargo registry on git.gabmacn.com, never to crates.io.
# `.cargo/config.toml` declares the registry's index.
publish = ["gmn"]

# Each dependency is annotated with the job it serves, so that one which turns
# out to be unnecessary can be removed with its comment.
[workspace.dependencies]
# The workspace's own crates. Builds use `path`; a published crate depends on
# the same version in the `gmn` registry instead. The three crates are
# released together, so each requires the others' exact version, which must
# equal `workspace.package.version`.
#
# Shared documentation tracking logic used by the CLI.
source-sentry-core = { path = "crates/core", version = "=0.1.0-rc.1", registry = "gmn" }
# The git backend: snapshots, history and atomic writes.
source-sentry-git = { path = "crates/git", version = "=0.1.0-rc.1", registry = "gmn" }
# Command-line parsing through derive macros.
clap = { version = "4.6", features = ["derive"] }
# Typed errors for the libraries and the binary.
thiserror = "2.0"

# Reads the git object database and history. Since 0.21 the default feature
# set is empty, so no network transport or OpenSSL is compiled in.
# `unstable-sha256` builds the vendored libgit2 with its experimental SHA-256
# support, so that one build reads both SHA-1 and SHA-256 repositories.
# Working-tree hashing goes through `git hash-object` instead, so that git's
# built-in conversions, such as line endings, apply as they would on commit.
git2 = { version = "0.21", features = ["unstable-sha256"] }
# Matches `sources:` patterns and gitignore-style config patterns against
# tracked paths.
globset = "0.4"
# Compiles series patterns, which are the only regular expressions in configs.
# Its engine crates already arrive through `globset`.
regex = "1.13"

# Frontmatter, configs and presets. A maintained, pure-Rust YAML
# deserializer; `serde_yaml_ng` has had no release since May 2024.
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
# Lockfiles and machine-readable `--json` output.
serde_json = "1.0"
# Names the field or setting that failed to parse, such as
# `documents["a.md"].sources[0].oid` or `documents.ignore[1]`.
serde_path_to_error = "0.1"

# SHA-256 for Git LFS pointers, which Source Sentry computes natively.
sha2 = "0.11"
# Parses dates and times in ISO 8601 format, including time zones.
chrono = { version = "0.4", features = ["serde"] }
# Time zones for schedules, with the IANA time zone database compiled in.
# Only the bundled copy is read, never the system's, so Windows and Linux
# apply the same rules. `chrono-tz` was passed over: its
# latest release carries tzdata 2025b.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Expands the RFC 5545 recurrence rules of cadences.
rrule = "0.14"

# Line diffs rendered during review.
similar = "3.2"
# Interactive review answers and confirmations on Windows and Unix terminals.
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
# Terminal colour that respects `NO_COLOR` and redirected output, including on
# Windows consoles.
anstream = "1.0"
owo-colors = "4.4"

# Temporary files for full review diffs, and repositories for tests.
tempfile = "3.27"

# Product lint policy, matching the other products. A crate applies it with
# `[lints] workspace = true`.
#
# Moon's `lint` task runs Clippy with `-D warnings`, so every "warn" below fails
# verification. "warn" only keeps `cargo check` and the editor loop usable while
# code is in progress; "deny" is for rules that should never compile at all.
#
# Exceptions go through `#[expect(lint, reason = "...")]` on the narrowest item
# possible, and every exception states its reason.

[workspace.lints.rust]
# "Never use `unsafe` to evade ownership, bounds, or error handling." Code that
# genuinely needs it must opt out explicitly and narrowly.
unsafe_code = "deny"
# "Describe what public APIs do."
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic is blocking under `-D warnings`. Opt out of individual lints with a
# reason here rather than lowering the group.
pedantic = { level = "warn", priority = -1 }

# Restriction lints are selected individually; never enable the whole group.
#
# "Do not introduce production `.unwrap()`." Tests are exempt via clippy.toml.
unwrap_used = "deny"
# `.expect(...)` is allowed only for a proven invariant. Mark each one with
# `#[expect(clippy::expect_used, reason = "<why success is guaranteed>")]`.
expect_used = "warn"
# "Do not replace error handling with `panic!`, `unreachable!`, ..."
panic = "warn"
unreachable = "warn"
# "Do not finish requested functionality with `todo!` or `unimplemented!`."
todo = "warn"
unimplemented = "warn"
# "Prefer `#[expect(lint, reason = ...)]`": no bare `#[allow]`, and every
# exception states its reason. Stale expectations then fail the build too.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# "Distinguish deep copies from `Rc`/`Arc` handle clones": write
# `Rc::clone(&x)` so a handle clone is visible at the call site.
clone_on_ref_ptr = "warn"
# "Document each operation's proof with `// SAFETY:`."
undocumented_unsafe_blocks = "warn"
# Leftover debugging output.
dbg_macro = "warn"
