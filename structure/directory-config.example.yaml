# A directory config, at <directory>/source-sentry.yaml. It applies to this
# directory and to everything below it within the same project.

# Scans this directory for documents. A directory with a lockfile is scanned
# by default; set `root: false` to stop that. Not inherited by subdirectories.
root: true
# Cuts parent directory settings for this directory and its descendants.
# The project config still applies; the flag itself is local to this config.
inherit: false

# Presets from .source-sentry/presets/, applied in order before this file's
# own settings. 'logs' means presets/logs.yaml, using the nearest project
# that supplies it. A directory config cannot import a defining preset.
imports: ['logs']

# Defaults for documents in this directory, including files nothing tracks
# yet.
classes: ['internal-docs']
owners: ['platform']

documents:
  # Added to the ignores inherited from parent directories. A leading `!`
  # brings a path back, and the last matching line wins.
  ignore:
    - 'scratch/'
    - '!scratch/keep.md'

# Extra rules for a context declared in the project config. They apply only
# to documents in this directory.
rules:
  production:
    - classes: ['internal-docs']
      facts: ['overdue']
      outcome: warn

# Files whose names carry a version. The pattern is a regular expression that
# must match a whole path relative to this directory; the `version` group
# captures the part used for ordering. Overlapping series and duplicate parsed
# versions are errors.
series:
  daily-logs:
    pattern: '(?P<version>\d{4}-\d{2}-\d{2})\.md'
    # Versions order by value: integer uses ASCII digits (01 equals 1);
    # dotted compares numeric components (0.3 equals 0.3.0); date requires a
    # valid calendar date written exactly YYYY-MM-DD.
    version-kind: date # integer, dotted or date.
    # records-only requires every entry to be sealed; living keeps the newest
    # editable and requires its predecessors to be sealed. Run `seal` explicitly
    # for claimed entries awaiting their seal; the lifecycle never seals them.
    # `awaiting-seal` warns under the built-in default context. The newest
    # living entry cannot be sealed or retired, and removing it does not make
    # a sealed predecessor living again.
    lifecycle: records-only
