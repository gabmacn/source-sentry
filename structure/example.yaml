# Source Sentry reads only the `source-sentry` key of a document's frontmatter,
# and leaves every other key untouched.
source-sentry:
  # When someone last reread the whole document, and who.
  reviewed:
    at: 2026-11-07T15:02:44Z # Always in UTC.
    by: 'Ana Ribeiro (Legal)' # Given with `attest --reviewer`.
  # For a living-series entry, `attest` adds `completed` (also `at` and `by`)
  # on its first complete source review. It may appear in frontmatter or a
  # local lockfile; re-attesting does not create another completion.
  # Classes decide which context rules apply to this document. Declare them in
  # .source-sentry/source-sentry.yaml.
  classes: ['privacy']
  owners: ['legal']
  # Overrides grace and cadence separately; omitted fields stay inherited.
  # Set `cadence: null` to remove an inherited cadence.
  schedule:
    # Grace counts calendar days from the local date when drift started.
    # Without cadence, positive grace sets the due date to that date plus
    # grace; zero grace makes the document due at once. With cadence, the
    # due date is the first recurrence on or after that date plus grace.
    # A dated deadline becomes overdue at the start of the next local day.
    grace: 14
    cadence:
      dtstart: 2026-12-01 # The first due date; it must satisfy the rule.
      # An RFC 5545 rule value, without `RRULE:` or other properties, that
      # never ends: no COUNT or UNTIL. Frequencies must be DAILY or coarser,
      # with no BYHOUR, BYMINUTE or BYSECOND. RFC combinations are checked;
      # a BYDAY list cannot mix plain (MO) and numbered (1MO) weekdays.
      # Each next-date search is limited to 400 years; leaving the supported
      # calendar produces a date-out-of-range operational error.
      rrule: 'FREQ=MONTHLY;INTERVAL=2'
  sources:
    # A leading `/` starts at the project root. Any other path is relative
    # to this document. `:/` starts at the repository root, even in a nested
    # project. Sources may leave a project but never the repository.
    - path: '/src/models/user.rs'
      # Written by `attest`: the version of the source that was reviewed, and
      # who reviewed it, and when. `oid` and `reviewed` must appear together,
      # or both be absent. Each source has exactly one of `path` and `pattern`.
      oid: 'sha1:1234567890abcdef1234567890abcdef12345678'
      reviewed:
        at: 2026-11-07T14:32:05Z
        by: 'Bruno Costa' # Taken from git's user.name.
    # Not reviewed yet, so this reviewed document is stale. `unattested`
    # means it has no document, pattern or member review or path attestation.
    - path: '../diagrams/user-flow.svg'
    # Every tracked match has its own member attestation. The pattern has its
    # own review, but no oid. Quote patterns: YAML misreads a leading `*` or `!`.
    # Source globs match whole document-relative or `/`-rooted paths: `*`
    # never crosses `/`; a whole-component `**` spans directories. Matching
    # is case-sensitive, including on Windows. Unlike config patterns,
    # slashless source globs are not implicitly recursive; `!` is literal.
    # Backslashes are refused; use `[*]` for a literal wildcard.
    - pattern: '/db/migrations/*.sql'
      # Attesting the pattern writes its review and every current member's
      # review together. This stays when its last member is removed, without
      # recording a whole-document reread. New matches still need review.
      reviewed:
        at: 2026-11-07T14:32:05Z
        by: 'Bruno Costa'
      members:
        - path: '/db/migrations/0001-init.sql'
          oid: 'sha1:abcdef1234567890abcdef1234567890abcdef12'
          reviewed:
            at: 2026-11-07T14:32:05Z
            by: null # Nobody could be identified.
