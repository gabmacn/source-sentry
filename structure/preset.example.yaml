# A preset, at .source-sentry/presets/logs.yaml, which other configs import as
# 'logs'. It can hold any setting a directory config can, except `root` and
# `inherit`. Its patterns apply relative to the config that imports it.

# Presets can import other presets; this one needs none.
imports: []

classes: ['internal-docs']
schedule:
  grace: 7

series:
  weekly-logs:
    pattern: 'log-(?P<version>\d+)\.md'
    version-kind: integer
    lifecycle: records-only
    # Registering a successor with `track`, or `init` with paths or `--all`,
    # copies the newest earlier entry's live declaration, even if sealed.
    # Classes, owners, schedule and sources copy; relative source spellings
    # are re-expressed for the successor's directory. Reviews, the seal and
    # `completed` do not copy. Retired entries have no declaration to copy.
    # This also applies to `living` series. The plan shows the inheritance.
    # A new sealed log is due every Monday, with three days of grace.
    # Each window runs after the previous due date through this due date plus
    # grace, inclusive; the first has no lower bound. An entry credits at most
    # one window. records-only uses the introduction of `seal`; living uses
    # `completed`. Uncommitted markers do not count, and their stored `at`
    # values do not date the credit: it uses the minimum committer date from
    # the introducing first-parent commit through the evaluated revision.
    schedule:
      grace: 3
      cadence:
        dtstart: 2026-12-07
        rrule: 'FREQ=WEEKLY;BYDAY=MO'
