# The project config, at .source-sentry/source-sentry.yaml.

# Config, preset and frontmatter YAML must each contain one document. Use
# true/false for booleans; duplicate keys, merge keys and unsupported tags are
# rejected. Unknown declaration and config fields are errors.

# This file is optional. Without it: version 1, UTC, no declared classes and
# only the built-in default context. If present, it must set integer version 1.
# Only this file sets the format version for the whole project.
version: 1
# Due dates end at midnight in this time zone. Use an IANA name, such as
# 'Europe/Madrid'.
time-zone: 'UTC'

# Declare every class and context here or in a preset imported directly here.
# Class, context and series names use lowercase ASCII letters and digits,
# separated by single hyphens, with none at either end. Owner identifiers
# need only be nonblank.
define:
  classes:
    internal-docs:
      description: 'Engineering documentation that lives close to the code.'
    marketing:
      description: 'Material produced for people outside the team.'
    privacy:
      description: 'Describes the personal data that the application retains.'
    security: {}
  # A context decides what each finding means for a build. You choose one when
  # running a check; `default` applies when you choose none.
  # Outcomes increase in severity: pass < notice < warn < fail. A rule matches
  # any listed fact and any shared class; omitted or empty classes match all.
  # The most severe matching outcome wins; fallback applies only if none match.
  # `fresh` always passes and cannot be targeted by a rule. Other facts are
  # stale, due, overdue, unattested, unclaimed, upstream-stale, upstream-due,
  # timing-unknown, missed and awaiting-seal. A document is due from the
  # first instant of its due day, and an overdue one is also due. Upstream
  # staleness propagates transitively from stale, overdue, unattested or
  # timing-unknown documents, even when the immediate source file has not
  # changed; `upstream-due` propagates the same way from due documents.
  contexts:
    # Defining `default` replaces the built-in default context.
    # This one restates the built-in rules, which give a stale document a
    # notice until it is due, and adds one for unattested documents.
    default:
      fallback: warn # For any finding that no rule matches.
      rules:
        - facts: ['stale', 'upstream-stale']
          outcome: notice
        - facts: ['missed', 'unattested']
          outcome: notice
    staging:
      fallback: warn
      rules:
        - facts: ['stale', 'upstream-stale']
          outcome: notice
        - facts: ['missed']
          outcome: notice
    production:
      fallback: warn
      rules:
        - facts: ['missed']
          outcome: notice
        # Blocks a production deploy until the privacy policy is updated.
        - classes: ['privacy']
          facts: ['stale', 'due', 'overdue', 'unattested', 'timing-unknown',
                  'upstream-stale', 'upstream-due']
          outcome: fail

# Settings that every directory inherits, unless it overrides them.
# Presets resolve in this project, then in enclosing projects; this one needs none.
# Only this project config may import a preset containing `define`.
imports: []
documents:
  # include/ignore select unclaimed scan candidates. Existing on-file claims
  # are still read when their adapter permits it; configs and lockfiles are
  # read independently of ignores.
  # Config patterns use gitignore syntax: slashless patterns match at any
  # depth; a leading or internal `/` anchors at this config's directory (the
  # project root here), and a trailing `/` matches directories. Only ignore
  # patterns allow `!` exceptions; the last match wins. Source globs use a
  # different language, described in example.yaml.
  # include replaces the inherited list; adapters appends, and the last
  # matching mapping wins. `adapters: []` leaves the built-ins in place.
  # These include and adapter values match the built-in defaults; nothing is
  # ignored by default.
  include: ['*.md', '*.txt', '*.pdf']
  adapters:
    - match: '*.md'
      adapter: md-utf8 # Can carry its own declaration in frontmatter.
    - match: '*.txt'
      adapter: md-utf8
    - match: '*.pdf'
      adapter: opaque # Tracked through lockfiles only.
  ignore: ['node_modules/', 'target/']
schedule:
  # Built-in document defaults: empty classes and owners, zero grace and no
  # cadence. With no cadence, zero grace makes changed sources due at once;
  # example.yaml explains positive grace and its interaction with cadence.
  grace: 0
