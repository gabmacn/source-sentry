# The built-in default context, version 1. The repository config's `version`
# selects it.
#
# It applies when you choose no context and the repository config defines no
# context named `default`. Defining `default` there replaces this context
# entirely.
#
# A fresh document always passes. A stale document is a notice until it is
# due, and a document whose upstream document is stale is a notice until that
# document is due: `due`, `upstream-due` and `overdue` warn through the
# fallback. A document without a schedule is due as soon as it is stale, so it
# warns at once. A missed series entry is listed in the report without
# failing it, and every other finding warns.

fallback: warn # For any finding that no rule matches.
rules:
  - facts: ['stale', 'upstream-stale']
    outcome: notice
  - facts: ['missed']
    outcome: notice
