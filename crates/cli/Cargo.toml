[package]
name = "source-sentry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Tracks documentation and records against the repository sources they describe"
keywords = ["documentation", "staleness", "review", "ci", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
source-sentry-core.workspace = true
source-sentry-git.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
similar.workspace = true
anstream.workspace = true
owo-colors.workspace = true
chrono.workspace = true
inquire.workspace = true
ratatui.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Lets `cargo binstall --registry gmn source-sentry` install the prebuilt
# binary of a release instead of compiling it. The names follow the release
# archives, `source-sentry-<version>-<target>`, each holding a folder of the
# same name.
[package.metadata.binstall]
pkg-url = "https://git.gabmacn.com/gmn/source-sentry/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true
