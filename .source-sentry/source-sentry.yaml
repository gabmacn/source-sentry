# Source Sentry tracks its own documentation with this project config and
# the lockfiles inside the project. Every setting is written out, including
# built-in defaults, so this file is also a complete starting point.
# structure/repository-config.example.yaml explains each key.
# A project uses its own configs independently of enclosing projects.

version: 1
time-zone: UTC

define:
  classes: {}
  # The built-in default: stale documents, documents with a stale upstream
  # document and missed series entries are notices; other findings, such as
  # `due`, `upstream-due` and `overdue`, warn.
  contexts:
    default:
      fallback: warn
      rules:
        - facts: ['stale', 'upstream-stale']
          outcome: notice
        - facts: ['missed']
          outcome: notice

imports: []
classes: []
owners: []

documents:
  include:
    # The built-in defaults.
    - '*.md'
    - '*.txt'
    - '*.pdf'
    # The example files describe the file formats and the CI integration as
    # the code defines them, so they must follow the code as prose does.
    - 'structure/*.yaml'
    - 'structure/*.json'
    - 'recipes/**/*.yml'
  # The last matching line wins.
  adapters:
    - match: '*.md'
      adapter: md-utf8
    - match: '*.txt'
      adapter: md-utf8
    - match: '*.pdf'
      adapter: opaque
    # The example's frontmatter shows a declaration; it is not this
    # repository's own. Read as opaque, it is tracked through the lockfile.
    - match: 'docs/example.md'
      adapter: opaque
    # YAML and JSON files carry no frontmatter.
    - match: 'structure/*.yaml'
      adapter: opaque
    - match: 'structure/*.json'
      adapter: opaque
    - match: 'recipes/**/*.yml'
      adapter: opaque
  ignore:
    # Release notes are written once per release, not kept in step with the
    # code.
    - 'CHANGELOG.md'
    # Issue and pull request templates are forms, not documentation.
    - '.forgejo/'

schedule:
  # The built-in default: documents must follow their sources at once.
  grace: 0
  # No recurring reread deadline unless a document declares one.
  cadence: null

# No additional scoped context rules or versioned series.
rules: {}
series: {}
